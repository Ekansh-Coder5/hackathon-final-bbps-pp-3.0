<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privex</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      color: #e8f2f7;
      background: #10212b;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 14px; font-size: 18px; }
    .account { padding: 12px; border: 1px solid #2b4653; border-radius: 9px; background: #172d38; }
    .account strong { display: block; font-size: 15px; }
    .account .sub { color: #a9bfca; }
    code { color: #a8dcff; font: 12px/1.45 ui-monospace, Consolas, monospace; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 0; }
    .stat { padding: 10px; border: 1px solid #2b4653; border-radius: 9px; }
    .stat b { display: block; color: #6dd6b0; font-size: 18px; }
    .stat span { color: #91a9b5; font-size: 11px; }
    .hint { margin: 12px 0 0; color: #91a9b5; font-size: 12px; }
    footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    button { padding: 7px 11px; color: #e8f2f7; background: #203b48; border: 1px solid #3a5968; border-radius: 7px; cursor: pointer; font: inherit; }
    button:hover { background: #2a4b5a; }
    button.primary { background: #047CBC; border-color: #047CBC; color: #fff; font-weight: 600; }
    button.primary:hover { background: #03689C; }
  </style>
</head>
<body>
  <h1>🔒 Privex</h1>
  <section class="account" aria-live="polite">
    <strong id="who">Loading…</strong>
    <span class="sub" id="whoSub"></span>
  </section>
  <div class="stats" id="stats" hidden>
    <div class="stat"><b id="savedCount">0</b><span id="savedLabel">saved values</span></div>
    <div class="stat"><b id="accountCount">0</b><span id="accountLabel">accounts on this browser</span></div>
  </div>
  <p class="hint">Saved values are encrypted. Open Saved data and enter your password to see them.</p>
  <footer>
    <button id="signOutBtn" type="button" hidden>Sign out</button>
    <button id="manageBtn" class="primary" type="button">Open saved data</button>
  </footer>
  <script src="privex_accounts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
